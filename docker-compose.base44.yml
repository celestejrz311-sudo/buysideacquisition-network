services:
  db:
    image: postgres:16
    restart: on-failure
    environment:
      POSTGRES_USER: buyside
      POSTGRES_PASSWORD: buyside_dev
      POSTGRES_DB: buyside
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buyside -d buyside"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-push:
    image: node:24-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      CI: "true"
      DATABASE_URL: postgresql://buyside:buyside_dev@db:5432/buyside
    command:
      - sh
      - -ec
      - |
        npm install -g pnpm@10
        pnpm install --frozen-lockfile
        pnpm --filter @workspace/db run push
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: node:24-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      CI: "true"
      NODE_ENV: development
      PORT: "5000"
      DATABASE_URL: postgresql://buyside:buyside_dev@db:5432/buyside
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command:
      - sh
      - -ec
      - |
        npm install -g pnpm@10
        pnpm install --frozen-lockfile
        exec pnpm --filter @workspace/api-server run dev
    depends_on:
      db:
        condition: service_healthy
      db-push:
        condition: service_completed_successfully
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 180s

  web:
    image: node:24-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      CI: "true"
      PORT: "5173"
      BASE_PATH: "/"
      API_PROXY_TARGET: http://api:5000
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command:
      - sh
      - -ec
      - |
        npm install -g pnpm@10
        pnpm install --frozen-lockfile
        exec pnpm --filter @workspace/buyside run dev
    ports:
      - "3000:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 180s

volumes:
  db-data:
